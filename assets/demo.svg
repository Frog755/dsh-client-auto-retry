<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="1" stop-color="#1a1b20"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23242b"/>
      <stop offset="1" stop-color="#1c1d23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d7cf6"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="1" stop-color="#58d68d"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e67e22"/>
      <stop offset="1" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8fa3"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea8fe"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg)" rx="16"/>

  <!-- Header -->
  <text x="48" y="52" fill="#f5f6fa" font-size="26" font-weight="700">@frog755/dsh-client-auto-retry</text>
  <text x="48" y="80" fill="#9aa0b4" font-size="15">回合被中断 / 出错 / 超长时自动发送「继续」，不切换模型 / provider</text>
  <line x1="48" y1="100" x2="912" y2="100" stroke="#2c2d35" stroke-width="1"/>

  <!-- Step 1: events.mux -->
  <g filter="url(#shadow)">
    <rect x="48" y="130" width="260" height="86" rx="12" fill="url(#card)"/>
    <circle cx="78" cy="160" r="14" fill="url(#accent)"/>
    <text x="78" y="165" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="104" y="158" fill="#eef0f6" font-size="16" font-weight="600">api.events.mux</text>
    <text x="104" y="180" fill="#8b8fa3" font-size="12.5">监听全部会话事件流</text>
    <text x="104" y="199" fill="#6b7084" font-size="11.5">turn/start · turn/end · user/message</text>
  </g>

  <line x1="308" y1="173" x2="356" y2="173" stroke="#8b8fa3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: turn/end detection -->
  <g filter="url(#shadow)">
    <rect x="356" y="130" width="248" height="86" rx="12" fill="url(#card)"/>
    <circle cx="386" cy="160" r="14" fill="url(#warn)"/>
    <text x="386" y="165" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="412" y="158" fill="#eef0f6" font-size="16" font-weight="600">turn/end 检测</text>
    <text x="412" y="180" fill="#8b8fa3" font-size="12.5">reason.kind 命中 ↓</text>
    <text x="412" y="199" fill="#e67e22" font-size="12" font-weight="600">error · interrupted · max-tokens</text>
  </g>

  <line x1="604" y1="173" x2="652" y2="173" stroke="#8b8fa3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: grace + schedule -->
  <g filter="url(#shadow)">
    <rect x="652" y="130" width="260" height="86" rx="12" fill="url(#card)"/>
    <circle cx="682" cy="160" r="14" fill="url(#accent)"/>
    <text x="682" y="165" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="708" y="158" fill="#eef0f6" font-size="16" font-weight="600">宽限期 + 调度</text>
    <text x="708" y="180" fill="#8b8fa3" font-size="12.5">graceMs 后触发</text>
    <text x="708" y="199" fill="#6b7084" font-size="11.5">冷却期 · 连续次数上限 · 跳过 subagent</text>
  </g>

  <!-- Step 4: prompt -->
  <g filter="url(#shadow)">
    <rect x="350" y="300" width="260" height="86" rx="12" fill="url(#card)"/>
    <circle cx="380" cy="330" r="14" fill="url(#ok)"/>
    <text x="380" y="335" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="406" y="328" fill="#eef0f6" font-size="16" font-weight="600">sessions.prompt</text>
    <text x="406" y="350" fill="#8b8fa3" font-size="12.5">向该会话发送「继续」</text>
    <text x="406" y="369" fill="#2ecc71" font-size="12" font-weight="600">mode: "queue" · 原样进入会话日志</text>
  </g>

  <!-- Step 5: guards -->
  <g filter="url(#shadow)">
    <rect x="652" y="300" width="260" height="86" rx="12" fill="url(#card)"/>
    <circle cx="682" cy="330" r="14" fill="url(#warn)"/>
    <text x="682" y="335" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="708" y="328" fill="#eef0f6" font-size="16" font-weight="600">防失控护栏</text>
    <text x="708" y="350" fill="#8b8fa3" font-size="12.5">连续 ≥ maxConsecutive 停手</text>
    <text x="708" y="369" fill="#6b7084" font-size="11.5">等待人工介入 · 不烧 token</text>
  </g>

  <!-- vertical connectors -->
  <path d="M 480 216 L 480 300" stroke="#8b8fa3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 782 216 L 782 300" stroke="#8b8fa3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- boot scan -->
  <g filter="url(#shadow)">
    <rect x="48" y="300" width="260" height="86" rx="12" fill="url(#card)" stroke="#3a3c46" stroke-dasharray="5 4"/>
    <circle cx="78" cy="330" r="14" fill="#3a3c46"/>
    <text x="78" y="335" fill="#c9cdda" font-size="14" font-weight="700" text-anchor="middle">B</text>
    <text x="104" y="328" fill="#eef0f6" font-size="16" font-weight="600">启动扫描</text>
    <text x="104" y="350" fill="#8b8fa3" font-size="12.5">scanOnBoot · freshMs 窗口内</text>
    <text x="104" y="369" fill="#6b7084" font-size="11.5">恢复最近被中断的会话</text>
  </g>

  <path d="M 178 216 L 178 300" stroke="#3a3c46" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>

  <!-- footer -->
  <line x1="48" y1="420" x2="912" y2="420" stroke="#2c2d35" stroke-width="1"/>
  <text x="48" y="452" fill="#9aa0b4" font-size="13">不做的：</text>
  <text x="120" y="452" fill="#6b7084" font-size="13">✗ 不切换模型 / provider　✗ 不重发整个回合　✗ 不绕过审批</text>
  <text x="48" y="478" fill="#6b7084" font-size="12">GitHub: github.com/Frog755/dsh-client-auto-retry · npm: @frog755/dsh-client-auto-retry · MIT</text>
  <text x="48" y="502" fill="#4a4d5c" font-size="11">适配 DeepSeek Harness 0.1.0-rc.7 · 其他版本见 README 兼容性章节</text>
</svg>
